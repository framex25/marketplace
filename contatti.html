<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contatti - FrameX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: white;
      color: black;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #ccc;
      background-color: #fff;
    }

    .logo {
      font-size: 1.5em;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      gap: 20px;
    }

    .nav-buttons button {
      background: none;
      border: 2px solid black;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .nav-buttons button:hover {
      background: black;
      color: white;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: black;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 0;
      left: -100%;
      width: 200px;
      height: 100%;
      background-color: white;
      padding: 60px 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
      flex-direction: column;
      gap: 20px;
      transition: left 0.3s;
    }

    .mobile-menu button {
      background: none;
      border: 2px solid black;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .mobile-menu.open {
      left: 0;
    }

    .contacts-section {
      padding: 60px 20px;
      text-align: center;
    }

    .contacts-section h2 {
      font-size: 2em;
      margin-bottom: 40px;
    }

    .contact-item {
      font-size: 1.2em;
      margin: 20px 0;
    }

    .contact-item a {
      color: black;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .nav-buttons {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .mobile-menu {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">FrameX</div>
    <div class="nav-buttons">
        <a href="index.html">
            <button>Home</button>
          </a>
          <a href="prodotti.html">
            <button>Prodotti</button>
          </a>
          <a href = "contatti.html">
            <button>Contatti</button>
          </a>
    </div>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">
        <button>Home</button>
      </a>
      <a href="prodotti.html">
        <button>Prodotti</button>
      </a>
      <a href = "contatti.html">
        <button>Contatti</button>
      </a>
  </div>

  <section class="contacts-section">
    <h2>Contattaci</h2>
    <div class="contact-item">
      📧 Email: <a href="mailto:framex.tech25@gmail.com">framex.tech25@gmail.com</a>
    </div>
    <div class="contact-item">
      📸 Instagram: <a href="https://instagram.com/framexofficial/" target="_blank">@framexofficial</a>
    </div>
    <div class="contact-item">
      🎵 TikTok: <a href="https://tiktok.com/@framex25.04" target="_blank">@framex25.05</a>
    </div>
  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("open");
    }
  </script>

</body>
</html>
