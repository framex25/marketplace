<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prodotti - FrameX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: white;
      color: black;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #ccc;
      background-color: #fff;
    }

    .logo {
      font-size: 1.5em;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      gap: 20px;
    }

    .nav-buttons button {
      background: none;
      border: 2px solid black;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .nav-buttons button:hover {
      background: black;
      color: white;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: black;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 0;
      left: -100%;
      width: 200px;
      height: 100%;
      background-color: white;
      padding: 60px 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
      flex-direction: column;
      gap: 20px;
      transition: left 0.3s;
    }

    .mobile-menu button {
      background: none;
      border: 2px solid black;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .mobile-menu.open {
      left: 0;
    }

    .products-section {
      padding: 60px 20px;
      text-align: center;
    }

    .products-section h2 {
      font-size: 2em;
      margin-bottom: 40px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      justify-items: center;
    }

    .product-card {
      border: 2px solid #000; /* Bordo più pesante */
      border-radius: 10px;
      max-width: 300px;
      transition: transform 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .product-card img {
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .product-card h3 {
      font-size: 1.2em;
      margin: 15px 0 10px;
    }

    .product-card p {
      font-size: 0.95em;
      padding: 0 15px 10px;
      color: #333;
    }

    .product-card a {
      display: inline-block;
      margin: 0 0 15px;
      padding: 10px 20px;
      background-color: black;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .product-card a:hover {
      background-color: #333;
    }

    @media (max-width: 768px) {
      .nav-buttons {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .mobile-menu {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">FrameX</div>
    <div class="nav-buttons">
        <a href="index.html">
            <button>Home</button>
          </a>
          <a href="prodotti.html">
            <button>Prodotti</button>
          </a>
          <a href = "contatti.html">
            <button>Contatti</button>
          </a>
    </div>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">
        <button>Home</button>
      </a>
      <a href="prodotti.html">
        <button>Prodotti</button>
      </a>
      <a href = "contatti.html">
        <button>Contatti</button>
      </a>
  </div>

  <section class="products-section">
    <h2>I nostri prodotti</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://cdn.custompc.com/wp-content/sites/custompc/2023/02/amd-ryzen-7-7700-01.jpg" alt="Ryzen 7 7700">
        <h3>AMD Ryzen 7 7700</h3>
        <p>8 core, 16 thread, fino a 5.3GHz. Socket AM5.</p>
        <a href="ryzen7700.html">Ispeziona</a>
      </div>
    </div>
  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("open");
    }
  </script>

</body>
</html>
